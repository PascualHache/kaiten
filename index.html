<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E6E5E1" />
    <!-- El widget de /reservas carga desde aquí y luego abre un iframe contra
         el mismo origen: adelantar DNS + TLS le quita un viaje a la espera. -->
    <link rel="preconnect" href="https://bookeo.com" />
    <link rel="dns-prefetch" href="https://bookeo.com" />
    <!-- Tipografías autoalojadas (scripts/fetch-fonts.mjs): los @font-face
         viven en src/fonts.css, que index.css importa, así que viajan dentro
         del CSS principal — ni petición a fonts.googleapis.com ni preconnect.
         Estos dos preload adelantan solo las caras del primer pintado: Poppins
         700 del <h1> del hero e Inter variable del cuerpo, subconjunto latin.
         El resto (latin-ext, pesos 400/500/600 de Poppins, la cursiva) los pide
         el navegador cuando los necesita, vía unicode-range.
         `crossorigin` es obligatorio aunque sea mismo origen: las fuentes se
         piden siempre en modo CORS y sin él se descargarían dos veces.
         Vite reescribe estos href a la ruta con hash del build. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/src/assets/fonts/poppins-latin-700-normal.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/src/assets/fonts/inter-latin-400-700-normal.woff2"
      crossorigin
    />

    <!-- El LCP de la portada es la foto del hero, y en una SPA el <img> no
         existe hasta que React monta: el navegador no podía ni empezar a
         pedirla durante el parseo del HTML ("LCP request discovery"). Estos dos
         preload la descubren en el documento inicial y con prioridad alta.
         El `media` replica exactamente el breakpoint del <picture> de Hero.tsx
         (max-width: 768px) para que solo se descargue la variante que se usa;
         si cambia uno, cambia el otro o se bajarán las dos fotos.
         Vite reescribe estos href a la ruta con hash del build. -->
    <link
      rel="preload"
      as="image"
      href="/src/assets/images/kaiten_home.webp"
      type="image/webp"
      fetchpriority="high"
      media="(min-width: 768.05px)"
    />
    <link
      rel="preload"
      as="image"
      href="/src/assets/images/kaiten_home_mobile.webp"
      type="image/webp"
      fetchpriority="high"
      media="(max-width: 768px)"
    />
    <title>Kaiten — Escuela de esquí en Baqueira Beret</title>
    <meta
      name="description"
      content="Clases privadas, freeride, safari y programas de mejora intensiva en Baqueira Beret. Experiencias de esquí totalmente personalizadas"
    />

    <link rel="canonical" href="https://kaitenski.com/" />

    <!-- Open Graph / WhatsApp preview.
         og:image y og:url van en absoluto a propósito: WhatsApp, Facebook y
         LinkedIn no resuelven rutas relativas, así que con "/og-image.png" la
         tarjeta se compartía sin imagen. El host debe ser el canónico (apex,
         sin www) para que coincida con el <link rel="canonical">. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kaiten" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://kaitenski.com/" />
    <meta property="og:title" content="Kaiten — Escuela de esquí en Baqueira Beret" />
    <meta
      property="og:description"
      content="Clases privadas, freeride, safari y programas de mejora intensiva en Baqueira Beret. Experiencias de esquí totalmente personalizadas"
    />
    <meta property="og:image" content="https://kaitenski.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Kaiten — escuela de esquí en Baqueira Beret"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kaiten — Escuela de esquí en Baqueira Beret" />
    <meta
      name="twitter:description"
      content="Clases privadas, freeride, safari y programas de mejora intensiva en Baqueira Beret. Experiencias de esquí totalmente personalizadas"
    />
    <meta name="twitter:image" content="https://kaitenski.com/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Kaiten — escuela de esquí en Baqueira Beret"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Marcador para el validador de Bookeo. NO es el widget.

      El widget real lo inyecta React en /reservas (src/components/BookeoWidget.tsx).
      Su validador descarga el HTML sin ejecutar JavaScript, así que en una SPA no
      encontraría nunca el código y rechaza la URL con "El código del widget no se
      encuentra en la página".

      El type="text/plain" es deliberado: con un tipo que no es JavaScript, el
      navegador ni ejecuta el script ni descarga el src. Solo deja en el HTML la
      cadena que el validador busca.

      NO lo conviertas en un <script> real: se cargaría en TODAS las páginas, habría
      dos instancias del widget y volvería el alert de "Multiple copies".

      El account id debe coincidir con BOOKEO_ACCOUNT_ID de src/data/booking.ts;
      scripts/check-booking-ids.mjs lo comprueba en cada build.
    -->
    <script type="text/plain" src="https://bookeo.com/widget.js?a=2234KCCH71A100914E4A"></script>
  </body>
</html>
